name: Terminus Backend CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terminus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pytest-asyncio alembic

      - name: Run Alembic Migrations & Pytest Test Suite
        env:
          PYTHONPATH: .
          ENVIRONMENT: testing
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/terminus_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci_test_secret_key_minimum_32_characters_long
          SECRET_KEY: ci_test_secret_key_minimum_32_characters_long
          WALLET_ENCRYPTION_KEY: hzk9siJMg9hJ2arrgJWuL62gpKd5KCVoEoaQ8NFlIAQ=
          SOLANA_RPC_URL: https://api.devnet.solana.com
        run: |
          alembic upgrade head
          python -m pytest -v --disable-warnings -o asyncio_mode=auto
